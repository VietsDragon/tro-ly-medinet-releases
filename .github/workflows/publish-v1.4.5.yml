name: Publish v1.4.5
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.4.5.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify tested package
        env:
          ARTIFACT_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-5a44-820b-9312-6b89dddfe561/raw?se=2026-10-03T17%3A32%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=2f105afd-87e1-4be9-8661-0792c3a05e81&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T19%3A52%3A57Z&ske=2026-10-03T19%3A52%3A57Z&sks=b&skv=2026-02-06&sig=PVEoyz4Arbhym7szEaZtrDFDkU/MZwoLl0QfekUY%2Bm0%3D"
        run: |
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o artifact.zip
          echo "53e4340f7f9daf99b4c20424c2ba8f7376db5d7bc171295b1f4ffa7e77129142  artifact.zip" | sha256sum -c -
          mkdir staging
          unzip -q artifact.zip -d staging
      - name: Verify portable checksum
        id: package
        run: |
          PORTABLE="staging/TroLyMedinet_Portable_v1.4.5.zip"
          EXPECTED="$(tr -d '\r\n' < "$PORTABLE.sha256" | tr 'A-F' 'a-f')"
          echo "$EXPECTED  $PORTABLE" | sha256sum -c -
          echo "sha=$EXPECTED" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.4.5 staging/TroLyMedinet_Portable_v1.4.5.zip --title "Trợ lý Medinet v1.4.5" --notes "Tự căn chiều cao hàng theo font, độ rộng cột và nội dung xuống dòng thực tế. Nội dung vượt giới hạn một hàng được chia tiếp nối, giữ STT và CCCD. Kiểm tra bảo toàn nội dung dài và chiều cao sau lưu đã đạt."
      - name: Update automatic update manifest
        run: |
          cat > latest.json <<EOF
          {
            "version": "1.4.5",
            "url": "https://github.com/VietsDragon/tro-ly-medinet-releases/releases/download/v1.4.5/TroLyMedinet_Portable_v1.4.5.zip",
            "downloadUrl": "https://github.com/VietsDragon/tro-ly-medinet-releases/releases/download/v1.4.5/TroLyMedinet_Portable_v1.4.5.zip",
            "fileName": "TroLyMedinet_Portable_v1.4.5.zip",
            "sha256": "${{ steps.package.outputs.sha }}",
            "notes": "Tự căn chiều cao hàng theo nội dung; tránh che chữ, bảo toàn nội dung dài."
          }
          EOF
          rm .github/workflows/publish-v1.4.5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json .github/workflows/publish-v1.4.5.yml
          git commit -m "Publish v1.4.5 and update manifest [skip ci]"
          git push

      - name: Remove superseded release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v1.4.3 --yes --cleanup-tag
