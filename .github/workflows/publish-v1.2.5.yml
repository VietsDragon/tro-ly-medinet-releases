name: Publish v1.2.5
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.2.5.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified build artifact
        env:
          ARTIFACT_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-1870-81f5-8304-54d354415898/raw?se=2026-09-23T02%3A39%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=75c0083d-3791-4b06-ba54-1c7601b99d9c&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T01%3A50%3A14Z&ske=2026-09-24T01%3A50%3A14Z&sks=b&skv=2026-02-06&sig=7QqQE0QOPUieZsyuoOYbfdmyKetax8cc0V4ba9GxNYI%3D"
          OUTER_SHA256: "8d108fc8c30bdde40eeb4abb1745fe7dd8664d183103ef1636d236d9182a8dd9"
        run: |
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o artifact.zip
          echo "$OUTER_SHA256  artifact.zip" | sha256sum -c -
          mkdir staging
          unzip -q artifact.zip -d staging
      - name: Verify portable package
        id: package
        run: |
          PORTABLE="$(find staging -name 'TroLyMedinet_Portable_v1.2.5.zip' -type f -print -quit)"
          test -n "$PORTABLE"
          ACTUAL_SHA="$(sha256sum "$PORTABLE" | awk '{print $1}')"
          echo "portable=$PORTABLE" >> "$GITHUB_OUTPUT"
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2.5 "${{ steps.package.outputs.portable }}" --title "Trợ lý Medinet v1.2.5" --notes "Thu gọn dashboard KSK doanh nghiệp: bỏ vùng kết quả kéo giãn, đặt số liệu và tóm tắt cùng một hàng; giới hạn vùng kết quả M11. Build Windows và hai bộ kiểm thử Excel đều đạt."
      - name: Update manifest and remove workflow
        run: |
          cat > latest.json <<EOF
          {
            "version": "1.2.5",
            "url": "https://github.com/VietsDragon/tro-ly-medinet-releases/releases/download/v1.2.5/TroLyMedinet_Portable_v1.2.5.zip",
            "sha256": "${{ steps.package.outputs.sha }}",
            "notes": "Dashboard KSK gọn hơn; bỏ khoảng trắng thừa; phần tóm tắt chỉ cao theo nội dung."
          }
          EOF
          rm .github/workflows/publish-v1.2.5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json .github/workflows/publish-v1.2.5.yml
          git commit -m "Phát hành v1.2.5 dashboard gọn [skip ci]"
          git push
