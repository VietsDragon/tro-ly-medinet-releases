name: Publish v1.2.0

on:
  push:
    paths:
      - '.github/workflows/publish-v1.2.0.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified build artifact
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-e6c8-81fa-85ac-5ee3ef99426b/raw?se=2026-09-23T00%3A25%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=e08341a6-e836-4fd3-84bf-9dcd49c0e920&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T23%3A58%3A41Z&ske=2026-09-23T23%3A58%3A41Z&sks=b&skv=2026-02-06&sig=%2BzYRIEh3r3uZlVS4glS%2BODg7Bk1/Dmf/4wMvYrGb8t8%3D' -OutFile artifact.zip
          $outer = (Get-FileHash artifact.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($outer -ne 'ff46a650013e5c7490e6e585d9540c35f765430796484b2ac7696db9b1ac2d16') { throw "Artifact checksum mismatch" }
          Expand-Archive -LiteralPath artifact.zip -DestinationPath staging -Force
          $inner = (Get-FileHash staging/TroLyMedinet_Portable_v1.2.0.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($inner -ne 'b2dcf98ce442b55add5ae765234fdffaf37e57f9e479fb129b7da6780a0dd0ca') { throw "Portable checksum mismatch" }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2.0 staging/TroLyMedinet_Portable_v1.2.0.zip --title "Trợ lý Medinet v1.2.0" --notes @"
          Giao diện wizard mới cho cả Tra cứu M11 và KSK doanh nghiệp.

          - Xác nhận cấu hình theo từng bước, sau đó chuyển sang dashboard tiến độ.
          - Nút Tạo lượt mới dừng an toàn lượt đang chạy và quay lại wizard.
          - Làm đẹp kết quả Excel M11 và báo cáo KSK doanh nghiệp.
          - Giữ cửa sổ Medinet như trước, không tự minimize.
          - Hỗ trợ kiểm tra và tải bản cập nhật từ GitHub Releases.
          - Đã qua build Windows và cả hai bộ kiểm thử Excel.
          "@

      - name: Update latest manifest and remove one-time workflow
        shell: pwsh
        run: |
          @'
          {
            "version": "1.2.0",
            "downloadUrl": "https://github.com/VietsDragon/tro-ly-medinet-releases/releases/download/v1.2.0/TroLyMedinet_Portable_v1.2.0.zip",
            "sha256": "B2DCF98CE442B55ADD5AE765234FDFFAF37E57F9E479FB129B7DA6780A0DD0CA",
            "fileName": "TroLyMedinet_Portable_v1.2.0.zip",
            "notes": "Wizard mới cho M11 và KSK doanh nghiệp, dashboard tiến độ, tạo lượt mới an toàn và Excel trình bày rõ ràng hơn."
          }
          '@ | Set-Content -LiteralPath latest.json -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-v1.2.0.yml
          git add latest.json
          git commit -m "Phát hành v1.2.0 và cập nhật manifest [skip ci]"
          git push
