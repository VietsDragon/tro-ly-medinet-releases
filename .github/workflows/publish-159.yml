name: Publish tested Medinet 1.6.0
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-159.yml"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified portable package
        env:
          PACKAGE_URL: 'https://sdmntprseasia.oaiusercontent.com/files/00000000-7b84-8207-9de9-5f2b0080e914/raw?se=2026-10-10T16%3A19%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=81e00f92-be4a-40f0-bc14-0500dca71e3a&skoid=ca37c3ec-ab43-496e-be5f-4684c5519a26&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T00%3A32%3A19Z&ske=2026-10-11T00%3A32%3A19Z&sks=b&skv=2026-02-06&sig=v/OZd8hJRRMk8EUSdSjwGqZa9yXoXswnxF5YjrYFhu0%3D'
        run: |
          curl --fail --silent --show-error --location "$PACKAGE_URL" -o package.zip
          echo '91c6a0a6ef8de424f084309703677e5025093523f8d2b786d963db9731c5c58e  package.zip' | sha256sum --check
          unzip package.zip -d package
          cd package
          expected=$(cat TroLyMedinet_Portable_v1.6.0.zip.sha256 | tr -d '\r\n')
          echo "$expected  TroLyMedinet_Portable_v1.6.0.zip" | sha256sum --check
      - name: Publish release and updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.txt <<'EOF'
          Hoàn thiện xuất ca cảnh báo nguy cơ cao M3/M4: danh sách chuẩn theo Ngân sách thành phố hỗ trợ, ghép an toàn, lọc trực tiếp và xuất Excel tổng hợp, Rất cao (báo điện thoại), Cao theo xã/phường (gửi trạm), Cần kiểm tra và ngưỡng đã áp dụng. Cho phép thêm/xóa/chỉnh mục, chỉ số và đơn vị; chia sẻ cấu hình gồm cả bộ lọc. Phiên bền vững cho M11, KSK công ty, Dashboard và Nguy cơ cao: thoát rồi tiếp tục, giữ dữ liệu đã kiểm chứng và tiến độ; không giới hạn số lần tiếp tục thủ công, tự phục hồi Medinet có giới hạn. Giao diện Windows thống nhất với sidebar module, tài khoản, nhật ký thu gọn và điều khiển phiên. Windows build, 50 kiểm tra nguy cơ cao, 10 kiểm tra phiên, regression Excel và 7 kịch bản trình duyệt giả lập đã PASS; gói portable đã chạy kiểm tra giao diện trên máy Windows và xem ảnh WPF ở tỷ lệ 125%/150%. Chưa kiểm tra toàn luồng với tài khoản và dữ liệu Medinet thật.
          EOF
          gh release create v1.6.0 package/TroLyMedinet_Portable_v1.6.0.zip package/TroLyMedinet_Portable_v1.6.0.zip.sha256 --title 'Trợ lý Medinet v1.6.0' --notes-file notes.txt --latest
          python3 - <<'PY'
          import json,pathlib,base64,subprocess
          filename='TroLyMedinet_Portable_v1.6.0.zip'
          url='https://github.com/VietsDragon/tro-ly-medinet-releases/releases/download/v1.6.0/'+filename
          sha=pathlib.Path('package/'+filename+'.sha256').read_text().strip().lower()
          manifest=dict(version='1.6.0',url=url,downloadUrl=url,fileName=filename,sha256=sha,notes='Nguy cơ cao xuất Excel đầy đủ; lưu phiên qua thoát app cho bốn module; giao diện thống nhất hiện đại. Đã kiểm thử và kiểm tra gói Windows.')
          existing=json.loads(subprocess.check_output(['gh','api','repos/VietsDragon/tro-ly-medinet-releases/contents/latest.json']))
          payload=dict(message='Publish updater manifest for tested Medinet v1.6.0',sha=existing['sha'],content=base64.b64encode((json.dumps(manifest,ensure_ascii=False,indent=2)+'\n').encode()).decode())
          pathlib.Path('manifest-request.json').write_text(json.dumps(payload))
          subprocess.run(['gh','api','--method','PUT','repos/VietsDragon/tro-ly-medinet-releases/contents/latest.json','--input','manifest-request.json'],check=True,stdout=subprocess.DEVNULL)
          PY
