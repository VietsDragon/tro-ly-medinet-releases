name: Publish v1.5.7
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.5.7.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify tested artifact
        env:
          ARTIFACT_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-1264-820b-8839-aa4f9711ae79/raw?se=2026-10-06T15%3A18%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=b4e1a7fa-aa77-4c57-ace0-58ec27f3d2e2&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T05%3A47%3A21Z&ske=2026-10-07T05%3A47%3A21Z&sks=b&skv=2026-02-06&sig=c10XOTC31emU4aJeOieqgZo5jycg8%2BdZzJ0zBhp%2B5wo%3D"
        run: |
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o artifact.zip
          echo "36ca1e782d867a4737b044eac286b6dbb915954849d1678d64e32fd661cb1bd4  artifact.zip" | sha256sum -c -
          mkdir staging
          unzip -q artifact.zip -d staging
      - name: Verify portable checksum
        id: package
        run: |
          PORTABLE="staging/TroLyMedinet_Portable_v1.5.7.zip"
          EXPECTED="$(tr -d '\r\n' < "$PORTABLE.sha256" | tr 'A-F' 'a-f')"
          echo "$EXPECTED  $PORTABLE" | sha256sum -c -
          echo "sha=$EXPECTED" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.5.7 staging/TroLyMedinet_Portable_v1.5.7.zip --title "Trợ lý Medinet v1.5.7" --notes "KSK công ty: cả danh sách M13 và chi tiết M3 vượt 40.000 hồ sơ tự chia theo tháng; tháng quá lớn tiếp tục chia nhỏ. Giữ bộ lọc Người sử dụng lao động chi trả. Ghép qua file tạm và kiểm tra đủ khoảng ngày, cấu trúc cột, số dòng từng phần và tổng Medinet. Dùng lại file đã tải khi đối chiếu đạt; log ghi rõ số dòng Medinet/Excel và lỗi ngày/chi trả. Build Windows và các bộ kiểm thử đã đạt; cần kiểm chứng tải Medinet thực tế."
      - name: Update manifest
        run: |
          cat > latest.json <<EOF
          {
            "version": "1.5.7",
            "url": "https://github.com/VietsDragon/tro-ly-medinet-releases/releases/download/v1.5.7/TroLyMedinet_Portable_v1.5.7.zip",
            "downloadUrl": "https://github.com/VietsDragon/tro-ly-medinet-releases/releases/download/v1.5.7/TroLyMedinet_Portable_v1.5.7.zip",
            "fileName": "TroLyMedinet_Portable_v1.5.7.zip",
            "sha256": "${{ steps.package.outputs.sha }}",
            "notes": "KSK công ty tự chia tháng khi vượt 40.000 hồ sơ; ghép và kiểm tra đủ dòng, log rõ số Medinet/Excel."
          }
          EOF
          rm .github/workflows/publish-v1.5.7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json .github/workflows/publish-v1.5.7.yml
          git commit -m "Publish v1.5.7 and update manifest [skip ci]"
          git push
      - name: Remove superseded release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v1.5.6 --yes --cleanup-tag
