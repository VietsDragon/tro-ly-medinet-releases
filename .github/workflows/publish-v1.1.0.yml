name: Publish v1.1.0

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify signed build artifact
        shell: pwsh
        run: |
          $artifactUrl = 'https://sdmntprukwest.oaiusercontent.com/files/00000000-ca04-8243-8490-2f10d5f0ad09/raw?se=2026-09-22T16%3A12%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=074c5dd3-cda5-4de7-bbd7-a2748d043baa&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T13%3A05%3A31Z&ske=2026-09-23T13%3A05%3A31Z&sks=b&skv=2026-02-06&sig=9IcvmJ%2B/um%2B1OkL5fh2L13ueH3CBdAZqQpRJZ6KCi88%3D'
          Invoke-WebRequest -Uri $artifactUrl -OutFile artifact.zip
          $outerHash = (Get-FileHash artifact.zip -Algorithm SHA256).Hash
          if ($outerHash -ne '11ACE91425C45BF69951F0EF76CD40463C66EC0E2CE1C445123E864EAB0C7C3E') {
            throw "Artifact SHA-256 mismatch: $outerHash"
          }
          Expand-Archive -LiteralPath artifact.zip -DestinationPath stage -Force
          $zip = '.\stage\TroLyMedinet_Portable_v1.1.0.zip'
          $expected = (Get-Content "$zip.sha256" -Raw).Trim()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected -or $actual -ne '86FB78DE4A58609B587A2908DE649CCCD2EC4D03FC9363C5EC14202BC80F3377') {
            throw "Portable SHA-256 mismatch: $actual"
          }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0 `
            '.\stage\TroLyMedinet_Portable_v1.1.0.zip' `
            '.\stage\TroLyMedinet_Portable_v1.1.0.zip.sha256' `
            --repo '${{ github.repository }}' `
            --title 'Trợ lý Medinet v1.1.0' `
            --notes @"
          ## Điểm mới

          - Chọn khoảng ngày KSK doanh nghiệp ổn định hơn và xác nhận đúng dữ liệu tải về.
          - Chạy lượt lọc mới ngay trong ứng dụng, không cần thoát rồi mở lại.
          - Giao diện M11 và KSK doanh nghiệp được sắp xếp gọn, dễ theo dõi hơn.
          - Thêm kiểm tra cập nhật và cập nhật an toàn qua GitHub Releases.
          - Trình duyệt Medinet vẫn hiển thị trong lúc chạy và tự đóng khi hoàn tất.

          SHA-256: `86FB78DE4A58609B587A2908DE649CCCD2EC4D03FC9363C5EC14202BC80F3377`
          "@

      - name: Publish update manifest and retire one-time workflow
        shell: pwsh
        run: |
          $manifest = [ordered]@{
            version = '1.1.0'
            downloadUrl = 'https://github.com/VietsDragon/tro-ly-medinet-releases/releases/download/v1.1.0/TroLyMedinet_Portable_v1.1.0.zip'
            sha256 = '86FB78DE4A58609B587A2908DE649CCCD2EC4D03FC9363C5EC14202BC80F3377'
            fileName = 'TroLyMedinet_Portable_v1.1.0.zip'
            notes = 'Chọn ngày có xác nhận đa máy, chạy lượt mới không cần thoát app, giao diện gọn hơn và hỗ trợ cập nhật.'
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath latest.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/publish-v1.1.0.yml'
          git add latest.json
          git commit -m 'Phát hành v1.1.0 và cập nhật manifest [skip ci]'
          git push
