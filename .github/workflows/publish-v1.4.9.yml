name: Publish v1.4.9
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.4.9.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify tested package
        env:
          ARTIFACT_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-b60c-820b-af0e-af00fa186336/raw?se=2026-10-04T02%3A41%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=770fe234-8662-42b5-94c3-37ea9c7d86a8&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T23%3A55%3A32Z&ske=2026-10-04T23%3A55%3A32Z&sks=b&skv=2026-02-06&sig=LtirWxLZAPdZIvH4ZS1BjA1LzX6gofSlhwCGGr95VO8%3D"
        run: |
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o artifact.zip
          echo "6e38051fedb739823f80f5d80a688ba6d351245f92772560b723f46b02601e50  artifact.zip" | sha256sum -c -
          mkdir staging
          unzip -q artifact.zip -d staging
      - name: Verify portable checksum
        id: package
        run: |
          PORTABLE="staging/TroLyMedinet_Portable_v1.4.9.zip"
          EXPECTED="$(tr -d '\r\n' < "$PORTABLE.sha256" | tr 'A-F' 'a-f')"
          echo "$EXPECTED  $PORTABLE" | sha256sum -c -
          echo "sha=$EXPECTED" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.4.9 staging/TroLyMedinet_Portable_v1.4.9.zip --title "Trợ lý Medinet v1.4.9" --notes "Chuẩn hóa câu X-quang về sentence case. Các kết luận bình thường như BT, bình thường, chưa ghi nhận bất thường, tim phổi bình thờng và tiền tố XQ/Kết luận được ghi thống nhất Tim phổi bình thường. Giữ nguyên ý nghĩa kết quả bất thường, nghi ngờ và ô trống. Build và các kiểm tra Excel đã đạt."
      - name: Update automatic update manifest
        run: |
          cat > latest.json <<EOF
          {
            "version": "1.4.9",
            "url": "https://github.com/VietsDragon/tro-ly-medinet-releases/releases/download/v1.4.9/TroLyMedinet_Portable_v1.4.9.zip",
            "downloadUrl": "https://github.com/VietsDragon/tro-ly-medinet-releases/releases/download/v1.4.9/TroLyMedinet_Portable_v1.4.9.zip",
            "fileName": "TroLyMedinet_Portable_v1.4.9.zip",
            "sha256": "${{ steps.package.outputs.sha }}",
            "notes": "Chuẩn hóa X-quang về sentence case; các kết luận bình thường thành Tim phổi bình thường."
          }
          EOF
          rm .github/workflows/publish-v1.4.9.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json .github/workflows/publish-v1.4.9.yml
          git commit -m "Publish v1.4.9 and update manifest [skip ci]"
          git push

      - name: Remove superseded release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v1.4.7 --yes --cleanup-tag
