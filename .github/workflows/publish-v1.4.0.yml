name: Publish v1.4.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.4.0.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified artifact
        env:
          ARTIFACT_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-e7d8-820b-8ca9-042a01bf59d7/raw?se=2026-09-23T06%3A46%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=27b8c4f7-c34c-4de5-9013-764dabcd21bc&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T05%3A54%3A33Z&ske=2026-09-24T05%3A54%3A33Z&sks=b&skv=2026-02-06&sig=DzN%2BusFUpYd4S58nO8AM6Ufr30A1lmvRHK6TwTEgz4s%3D"
          OUTER_SHA256: "e43c3efae1d295fe9f4c055ba788542a7134e12eac2dc5944317fbb20bbd6059"
        run: |
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o artifact.zip
          echo "$OUTER_SHA256  artifact.zip" | sha256sum -c -
          mkdir staging
          unzip -q artifact.zip -d staging
      - name: Locate package
        id: package
        run: |
          PORTABLE="$(find staging -name 'TroLyMedinet_Portable_v1.4.0.zip' -type f -print -quit)"
          test -n "$PORTABLE"
          ACTUAL_SHA="$(sha256sum "$PORTABLE" | awk '{print $1}')"
          echo "portable=$PORTABLE" >> "$GITHUB_OUTPUT"
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.4.0 "${{ steps.package.outputs.portable }}" --title "Trợ lý Medinet v1.4.0" --notes "Nâng cấp bốn mục: tự chờ và phục hồi nhiều tầng khi mạng/Medinet chậm; dashboard trung tâm điều hành với nhật ký lớn bên trái; Tạo lượt mới mở đúng tác vụ và giữ tài khoản; thông báo kèm âm báo khi hoàn tất. Build Windows và hai bộ kiểm thử Excel đều đạt."
      - name: Update manifest and clean workflow
        run: |
          cat > latest.json <<EOF
          {
            "version": "1.4.0",
            "url": "https://github.com/VietsDragon/tro-ly-medinet-releases/releases/download/v1.4.0/TroLyMedinet_Portable_v1.4.0.zip",
            "sha256": "${{ steps.package.outputs.sha }}",
            "notes": "Tự phục hồi mạng/Medinet; dashboard điều hành mới; tạo lượt mới đúng tác vụ; thông báo hoàn tất."
          }
          EOF
          rm .github/workflows/publish-v1.4.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json .github/workflows/publish-v1.4.0.yml
          git commit -m "Phát hành v1.4.0 ổn định và giao diện mới [skip ci]"
          git push
