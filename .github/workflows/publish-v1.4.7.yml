name: Publish v1.4.7
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.4.7.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify tested package
        env:
          ARTIFACT_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-1cc4-820b-8090-d9686c0f682e/raw?se=2026-10-03T18%3A14%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=c182affa-5a9a-427e-80fe-649fb1539e3d&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T06%3A20%3A25Z&ske=2026-10-04T06%3A20%3A25Z&sks=b&skv=2026-02-06&sig=LnkJV9FayH26rrhVKU1j3gRjCRfmYFhCyKFRrTctnFo%3D"
        run: |
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o artifact.zip
          echo "90ae870c16a083e685d06fa40262838cc6df20ee44578a5fe4b4d9fdb9c60f97  artifact.zip" | sha256sum -c -
          mkdir staging
          unzip -q artifact.zip -d staging
      - name: Verify portable checksum
        id: package
        run: |
          PORTABLE="staging/TroLyMedinet_Portable_v1.4.7.zip"
          EXPECTED="$(tr -d '\r\n' < "$PORTABLE.sha256" | tr 'A-F' 'a-f')"
          echo "$EXPECTED  $PORTABLE" | sha256sum -c -
          echo "sha=$EXPECTED" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.4.7 staging/TroLyMedinet_Portable_v1.4.7.zip --title "Trợ lý Medinet v1.4.7" --notes "Thêm native Rows.AutoFit qua Excel/WPS sau khi xuất. Chỉ dùng phiên Office riêng không có tài liệu đang mở; lưu bản sao trước khi thay kết quả; báo rõ khi Office không hỗ trợ tự động hóa. Build, kiểm tra Excel và cú pháp PowerShell đã đạt; CI không có Office để kiểm chứng thao tác COM thực tế."
      - name: Update automatic update manifest
        run: |
          cat > latest.json <<EOF
          {
            "version": "1.4.7",
            "url": "https://github.com/VietsDragon/tro-ly-medinet-releases/releases/download/v1.4.7/TroLyMedinet_Portable_v1.4.7.zip",
            "downloadUrl": "https://github.com/VietsDragon/tro-ly-medinet-releases/releases/download/v1.4.7/TroLyMedinet_Portable_v1.4.7.zip",
            "fileName": "TroLyMedinet_Portable_v1.4.7.zip",
            "sha256": "${{ steps.package.outputs.sha }}",
            "notes": "Thêm AutoFit thực sự qua Excel/WPS sau xuất; nhật ký báo rõ thành công hoặc chưa thực hiện được."
          }
          EOF
          rm .github/workflows/publish-v1.4.7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json .github/workflows/publish-v1.4.7.yml
          git commit -m "Publish v1.4.7 and update manifest [skip ci]"
          git push

      - name: Remove superseded release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v1.4.4 --yes --cleanup-tag
