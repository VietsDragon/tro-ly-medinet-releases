name: Publish v1.5.5
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.5.5.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify tested package
        env:
          ARTIFACT_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-a41c-820b-a0c3-110957971b62/raw?se=2026-10-05T15%3A53%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=a958b008-5cd6-4073-8355-7cf913f998ba&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T00%3A08%3A17Z&ske=2026-10-06T00%3A08%3A17Z&sks=b&skv=2026-02-06&sig=y7iXqOyuapikvsL4XupJCj3GCAkuiFkd/Cqd3o0ekj4%3D"
        run: |
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o artifact.zip
          echo "ded20615e9fd7cf254749aaa2ff199c83d7e234ba254c8eedd5db1090d3130fc  artifact.zip" | sha256sum -c -
          mkdir staging
          unzip -q artifact.zip -d staging
      - name: Verify portable checksum
        id: package
        run: |
          PORTABLE="staging/TroLyMedinet_Portable_v1.5.5.zip"
          EXPECTED="$(tr -d '\r\n' < "$PORTABLE.sha256" | tr 'A-F' 'a-f')"
          echo "$EXPECTED  $PORTABLE" | sha256sum -c -
          echo "sha=$EXPECTED" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.5.5 staging/TroLyMedinet_Portable_v1.5.5.zip --title "Trợ lý Medinet v1.5.5" --notes "Thêm chia khoảng ngày tự động cho sáu nguồn KSKTD trước khi xuất báo cáo trên 40.000 hồ sơ, tránh file bị cắt 50.000 dòng. Tải các khoảng ngày không chồng nhau, ghép nguyên cấu trúc và kiểm tra tổng dòng khớp Medinet. Phần còn lớn tiếp tục chia; nếu một ngày vượt ngưỡng an toàn thì dừng, không dùng dữ liệu thiếu. Ghép qua staging và chặn sai ngày/cột/tổng dòng. Build Windows và các kiểm thử Excel đã đạt; cần kiểm chứng tải Medinet thực tế. Chưa triển khai UPSERT."
      - name: Update automatic update manifest
        run: |
          cat > latest.json <<EOF
          {
            "version": "1.5.5",
            "url": "https://github.com/VietsDragon/tro-ly-medinet-releases/releases/download/v1.5.5/TroLyMedinet_Portable_v1.5.5.zip",
            "downloadUrl": "https://github.com/VietsDragon/tro-ly-medinet-releases/releases/download/v1.5.5/TroLyMedinet_Portable_v1.5.5.zip",
            "fileName": "TroLyMedinet_Portable_v1.5.5.zip",
            "sha256": "${{ steps.package.outputs.sha }}",
            "notes": "Tự chia khoảng ngày trước khi xuất nguồn KSKTD trên 40.000 hồ sơ; ghép và đối chiếu tổng dòng để tránh file thiếu do giới hạn xuất."
          }
          EOF
          rm .github/workflows/publish-v1.5.5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json .github/workflows/publish-v1.5.5.yml
          git commit -m "Publish v1.5.5 and update manifest [skip ci]"
          git push

      - name: Remove superseded release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v1.5.4 --yes --cleanup-tag