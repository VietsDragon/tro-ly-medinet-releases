name: Publish v1.4.10
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.4.10.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify tested package
        env:
          ARTIFACT_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-9948-820b-9d87-4feba87b4a9b/raw?se=2026-10-04T03%3A51%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=10e4e2c5-4136-4384-8cff-41e950dde5d2&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T03%3A24%3A32Z&ske=2026-10-05T03%3A24%3A32Z&sks=b&skv=2026-02-06&sig=Ws7ou/1XBxZi8pZ5/S9MgeDXKswtCuwN7SbX4Nhybao%3D"
        run: |
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o artifact.zip
          echo "fef21a693df2e79b14a7568d5b8b86125d39a7c01305f6f98fdf466ce9aaf5c0  artifact.zip" | sha256sum -c -
          mkdir staging
          unzip -q artifact.zip -d staging
      - name: Verify portable checksum
        id: package
        run: |
          PORTABLE="staging/TroLyMedinet_Portable_v1.4.10.zip"
          EXPECTED="$(tr -d '\r\n' < "$PORTABLE.sha256" | tr 'A-F' 'a-f')"
          echo "$EXPECTED  $PORTABLE" | sha256sum -c -
          echo "sha=$EXPECTED" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.4.10 staging/TroLyMedinet_Portable_v1.4.10.zip --title "Trợ lý Medinet v1.4.10" --notes "Sửa cơ chế trình bày chung cho toàn bộ file xuất: không ghi dấu xuống dòng theo độ rộng cột vào nội dung; chỉ giữ xuống dòng theo tiêu đề, chẩn đoán và chỉ số. Excel/WPS tự ngắt chữ và AutoFit. Bảo toàn dữ liệu, tiêu đề in đậm và hàng tiếp nối cho nội dung dài. Build và hai bộ kiểm tra Excel đã đạt."
      - name: Update automatic update manifest
        run: |
          cat > latest.json <<EOF
          {
            "version": "1.4.10",
            "url": "https://github.com/VietsDragon/tro-ly-medinet-releases/releases/download/v1.4.10/TroLyMedinet_Portable_v1.4.10.zip",
            "downloadUrl": "https://github.com/VietsDragon/tro-ly-medinet-releases/releases/download/v1.4.10/TroLyMedinet_Portable_v1.4.10.zip",
            "fileName": "TroLyMedinet_Portable_v1.4.10.zip",
            "sha256": "${{ steps.package.outputs.sha }}",
            "notes": "Sửa xuống dòng trên toàn bộ file xuất; Excel/WPS tự ngắt chữ theo độ rộng cột. Giữ nhóm chẩn đoán, xét nghiệm, AutoFit và nội dung dài."
          }
          EOF
          rm .github/workflows/publish-v1.4.10.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json .github/workflows/publish-v1.4.10.yml
          git commit -m "Publish v1.4.10 and update manifest [skip ci]"
          git push

      - name: Remove superseded release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v1.4.8 --yes --cleanup-tag