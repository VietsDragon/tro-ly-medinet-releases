name: Publish v1.5.8
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.5.8.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download tested artifact
        env:
          ARTIFACT_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-6748-8211-8d79-901b3158512d/raw?se=2026-10-09T14%3A17%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=ef4edaa3-9db5-4b44-bb52-2eb51f1bd150&skoid=ca37c3ec-ab43-496e-be5f-4684c5519a26&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-09T01%3A32%3A18Z&ske=2026-10-10T01%3A32%3A18Z&sks=b&skv=2026-02-06&sig=CljP%2B6HWfHI%2BQURg7MIEE5M5LRcXtHwBGOFtI/UPigU%3D"
        run: |
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o artifact.zip
          echo "cc2f6f0bcf136036fe0e1c58d3a0c3a3f0b4f6c4278f8ec876e62e043bc58ef5  artifact.zip" | sha256sum -c -
          mkdir staging
          unzip -q artifact.zip -d staging
      - name: Verify portable checksum
        id: package
        run: |
          PORTABLE="staging/TroLyMedinet_Portable_v1.5.8.zip"
          EXPECTED="$(tr -d '\r\n' < "$PORTABLE.sha256" | tr 'A-F' 'a-f')"
          echo "$EXPECTED  $PORTABLE" | sha256sum -c -
          echo "sha=$EXPECTED" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.5.8 staging/TroLyMedinet_Portable_v1.5.8.zip --title "Trợ lý Medinet v1.5.8" --notes "Đồng bộ 7 nguồn cho M2/M3/M4/CT. CT lọc Người sử dụng lao động chi trả, các mẫu KSKTD lọc Ngân sách thành phố hỗ trợ; dùng một nguồn M3 chi tiết và ghép theo hai danh sách riêng. File _IMPORT.xlsx chỉ gồm M2, M3, M4, CT; CAN_KIEM_TRA và LOG nằm trong file kiểm thử. Không chặn cả lượt cập nhật vì có hồ sơ cần kiểm tra; ca ghép xung đột chỉ dùng dữ liệu hành chính nền. Preview phải xác nhận đủ CT trước Áp dụng. Checkpoint cũ tái dùng nguồn đã tải và tạo lại output bổ sung CT. Build Windows và kiểm thử đã đạt; cần kiểm chứng Medinet/Dashboard thực tế. Chưa triển khai UPSERT."
      - name: Update manifest
        run: |
          cat > latest.json <<EOF
          {
            "version": "1.5.8",
            "url": "https://github.com/VietsDragon/tro-ly-medinet-releases/releases/download/v1.5.8/TroLyMedinet_Portable_v1.5.8.zip",
            "downloadUrl": "https://github.com/VietsDragon/tro-ly-medinet-releases/releases/download/v1.5.8/TroLyMedinet_Portable_v1.5.8.zip",
            "fileName": "TroLyMedinet_Portable_v1.5.8.zip",
            "sha256": "${{ steps.package.outputs.sha }}",
            "notes": "Đồng bộ M2/M3/M4/CT từ 7 nguồn, dùng chung M3 chi tiết; import bốn sheet và tiếp tục dù có ca cần kiểm tra."
          }
          EOF
          rm .github/workflows/publish-v1.5.8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json .github/workflows/publish-v1.5.8.yml
          git commit -m "Publish v1.5.8 and update manifest [skip ci]"
          git push
      - name: Remove superseded release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v1.5.7 --yes --cleanup-tag
