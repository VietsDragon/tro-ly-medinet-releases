name: Publish v1.4.8
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.4.8.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify tested package
        env:
          ARTIFACT_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-d120-820b-b060-77d1b3140e3e/raw?se=2026-10-04T02%3A33%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=fd087641-58eb-42d1-89a5-b43d7f9d204d&skoid=697dc613-6c29-4a76-87a7-d1b783c6d43f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T01%3A26%3A05Z&ske=2026-10-05T01%3A26%3A05Z&sks=b&skv=2026-02-06&sig=c9xaAEzrI2gj69JRvB6wITa59cr%2ByasIYhrFPtC%2B378%3D"
        run: |
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o artifact.zip
          echo "4142b0e2fc1c8827a21a07f185ec48cc606df419239b3126230470b1ec1bb869  artifact.zip" | sha256sum -c -
          mkdir staging
          unzip -q artifact.zip -d staging
      - name: Verify portable checksum
        id: package
        run: |
          PORTABLE="staging/TroLyMedinet_Portable_v1.4.8.zip"
          EXPECTED="$(tr -d '\r\n' < "$PORTABLE.sha256" | tr 'A-F' 'a-f')"
          echo "$EXPECTED  $PORTABLE" | sha256sum -c -
          echo "sha=$EXPECTED" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.4.8 staging/TroLyMedinet_Portable_v1.4.8.zip --title "Trợ lý Medinet v1.4.8" --notes "Thêm X-quang phổi cột M. Nhóm chẩn đoán xác định/sơ bộ theo đúng nguồn và in đậm tiêu đề. Điền câu mặc định khi toàn bộ khám lâm sàng trống. Sửa tách SL/SLBC, chia nhóm công thức máu/sinh hóa; Nitrit 5120 thành Âm tính; đề nghị dạng sentence case. Giữ AutoFit của Excel/WPS. Các kiểm tra xuất Excel đã đạt."
      - name: Update automatic update manifest
        run: |
          cat > latest.json <<EOF
          {
            "version": "1.4.8",
            "url": "https://github.com/VietsDragon/tro-ly-medinet-releases/releases/download/v1.4.8/TroLyMedinet_Portable_v1.4.8.zip",
            "downloadUrl": "https://github.com/VietsDragon/tro-ly-medinet-releases/releases/download/v1.4.8/TroLyMedinet_Portable_v1.4.8.zip",
            "fileName": "TroLyMedinet_Portable_v1.4.8.zip",
            "sha256": "${{ steps.package.outputs.sha }}",
            "notes": "Thêm X-quang cột M; định dạng chẩn đoán và xét nghiệm; sửa SLBC, Nitrit 5120 và sentence case đề nghị."
          }
          EOF
          rm .github/workflows/publish-v1.4.8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json .github/workflows/publish-v1.4.8.yml
          git commit -m "Publish v1.4.8 and update manifest [skip ci]"
          git push

      - name: Remove superseded release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v1.4.5 --yes --cleanup-tag
