name: Publish v1.2.4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.2.4.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified build artifact
        env:
          ARTIFACT_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-fcc8-8206-86ca-772832026f08/raw?se=2026-09-23T02%3A21%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=1669f1a9-8268-4504-b87a-8de7fa9edcdd&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T01%3A56%3A22Z&ske=2026-09-24T01%3A56%3A22Z&sks=b&skv=2026-02-06&sig=KxUt2wMBJEVztgyFzVCaz%2B/PR4hgpF7SYxBuadtKS3s%3D"
          OUTER_SHA256: "6a9a375430ecca2a7e6297d4c75cb5bde24de70b3ab155524c81b1c6602c72ad"
        run: |
          curl -L --fail --retry 3 "$ARTIFACT_URL" -o artifact.zip
          echo "$OUTER_SHA256  artifact.zip" | sha256sum -c -
          mkdir staging
          unzip -q artifact.zip -d staging
      - name: Verify portable package
        id: package
        run: |
          PORTABLE="$(find staging -name 'TroLyMedinet_Portable_v1.2.4.zip' -type f -print -quit)"
          test -n "$PORTABLE"
          ACTUAL_SHA="$(sha256sum "$PORTABLE" | awk '{print $1}')"
          echo "portable=$PORTABLE" >> "$GITHUB_OUTPUT"
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2.4 "${{ steps.package.outputs.portable }}" \
            --title "Trợ lý Medinet v1.2.4" \
            --notes "Bản vá khởi động cho giao diện mới v1.2.3: loại bỏ chuỗi văn bản bị chèn nhầm vào cây XAML. Giữ nguyên luồng đăng nhập dùng chung, wizard gọn và dashboard mới. Build Windows và hai bộ kiểm thử Excel đều đạt."
      - name: Update manifest and remove one-time workflow
        run: |
          cat > latest.json <<EOF
          {
            "version": "1.2.4",
            "url": "https://github.com/VietsDragon/tro-ly-medinet-releases/releases/download/v1.2.4/TroLyMedinet_Portable_v1.2.4.zip",
            "sha256": "${{ steps.package.outputs.sha }}",
            "notes": "Sửa lỗi khởi động giao diện v1.2.3; giữ nguyên wizard và dashboard mới."
          }
          EOF
          rm .github/workflows/publish-v1.2.4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json .github/workflows/publish-v1.2.4.yml
          git commit -m "Phát hành v1.2.4 sửa lỗi khởi động [skip ci]"
          git push
